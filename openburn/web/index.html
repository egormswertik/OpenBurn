<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenBurn Core - Laser CAM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- APP HEADER -->
  <header class="app-header">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ff3333" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      <span>OpenBurn</span>
      <span class="tag">Core 2.2</span>
    </div>

    <div class="top-actions">
      <label class="btn-top" style="cursor:pointer;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Open / Import
        <input type="file" id="fileInput" accept=".lbrn,.lbrn2,.svg" style="display:none;">
      </label>

      <button class="btn-top" id="btnPreview">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        Preview G-Code
      </button>

      <div class="device-badge">
        <span class="status-dot" id="statusDot"></span>
        <span id="deviceStateText">Disconnected</span>
      </div>

      <button class="btn-top" id="btnConnect" style="background:#007acc; border-color:#1c97ea; color:#fff;">
        Connect Laser
      </button>
    </div>
  </header>

  <!-- WORKSPACE -->
  <main class="workspace-container">
    
    <!-- LEFT CREATION TOOLBAR -->
    <nav class="left-toolbar">
      <button class="tool-btn active" id="tool-select" onclick="setTool('select')" title="Select (S)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7 18 3-7 7-3L3 3z"/></svg>
      </button>
      <button class="tool-btn" id="tool-rect" onclick="setTool('rect')" title="Rectangle (R)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
      </button>
      <button class="tool-btn" id="tool-ellipse" onclick="setTool('ellipse')" title="Ellipse (E)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
      </button>
      <button class="tool-btn" id="tool-pan" onclick="setTool('pan')" title="Pan (Middle Click or Shift)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
      </button>
    </nav>

    <!-- CENTER CANVAS -->
    <div class="canvas-viewport">
      <canvas id="mainCanvas"></canvas>
      <div class="canvas-overlay-hud">
        <div class="hud-item"><span id="hudCoords">X: 0.0 mm, Y: 0.0 mm</span></div>
        <div class="hud-item">Zoom: <span id="hudZoom">150%</span></div>
        <div class="hud-item">Grid: <span>10 mm</span></div>
      </div>
    </div>

    <!-- RIGHT SIDEBAR DOCKS -->
    <aside class="right-sidebar">
      
      <!-- CUTS / LAYERS DOCK -->
      <div class="panel">
        <div class="panel-header">
          <span>Cuts / Layers</span>
        </div>
        <div class="panel-body" style="padding:4px;">
          <table class="layer-table">
            <thead>
              <tr>
                <th style="width:24px;"></th>
                <th>Layer</th>
                <th>Mode</th>
                <th>Spd</th>
                <th>Pwr%</th>
              </tr>
            </thead>
            <tbody id="layerTableBody">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- LASER CONTROL DOCK -->
      <div class="panel">
        <div class="panel-header">
          <span>Laser Control</span>
        </div>
        <div class="panel-body">
          <div class="laser-btn-grid">
            <button class="btn-action btn-start" id="btnStart">Start</button>
            <button class="btn-action btn-pause" id="btnPause">Pause</button>
            <button class="btn-action btn-stop" id="btnStop">Stop</button>
            <button class="btn-action btn-frame" id="btnFrame" onclick="alert('Bounding frame simulated')">Frame</button>
          </div>
        </div>
      </div>

      <!-- MOVE / JOG DOCK -->
      <div class="panel">
        <div class="panel-header">
          <span>Move / Jog</span>
        </div>
        <div class="panel-body jog-container">
          <div class="jog-grid">
            <div></div>
            <button class="jog-btn" onclick="jogLaser(0, 1)">Y+</button>
            <div></div>
            <button class="jog-btn" onclick="jogLaser(-1, 0)">X-</button>
            <button class="jog-btn" id="btnHome" title="Home">H</button>
            <button class="jog-btn" onclick="jogLaser(1, 0)">X+</button>
            <div></div>
            <button class="jog-btn" onclick="jogLaser(0, -1)">Y-</button>
            <div></div>
          </div>
          
          <div class="jog-step-selector">
            <button class="jog-step-btn" id="step-0.1" onclick="setJogStep(0.1)">0.1</button>
            <button class="jog-step-btn" id="step-1" onclick="setJogStep(1)">1</button>
            <button class="jog-step-btn active" id="step-10" onclick="setJogStep(10)">10</button>
            <button class="jog-step-btn" id="step-50" onclick="setJogStep(50)">50</button>
          </div>

          <div style="display:flex; width:100%; gap:6px; margin-top:8px;">
            <button class="btn-top" id="btnZero" style="flex:1; justify-content:center;">Set Zero</button>
          </div>
        </div>
      </div>

      <!-- JOB ORIGIN DOCK -->
      <div class="panel">
        <div class="panel-header">
          <span>Job Origin</span>
        </div>
        <div class="panel-body" style="display:flex; align-items:center; justify-content:space-between;">
          <span style="font-size:12px; color:var(--text-secondary);">Start Position:</span>
          <div class="origin-matrix">
            <div class="origin-dot" onclick="setOriginPoint(0)"></div>
            <div class="origin-dot" onclick="setOriginPoint(1)"></div>
            <div class="origin-dot" onclick="setOriginPoint(2)"></div>
            <div class="origin-dot" onclick="setOriginPoint(3)"></div>
            <div class="origin-dot" onclick="setOriginPoint(4)"></div>
            <div class="origin-dot" onclick="setOriginPoint(5)"></div>
            <div class="origin-dot active" onclick="setOriginPoint(6)"></div>
            <div class="origin-dot" onclick="setOriginPoint(7)"></div>
            <div class="origin-dot" onclick="setOriginPoint(8)"></div>
          </div>
        </div>
      </div>

    </aside>
  </main>

  <!-- BOTTOM PALETTE BAR (30 + 2 LAYERS) -->
  <footer class="palette-bar" id="paletteBar">
    <!-- Populated by JS -->
  </footer>

  <!-- G-CODE PREVIEW MODAL -->
  <div class="modal-backdrop" id="previewModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <span>G-Code Trajectory Preview</span>
        <span id="gcodeLinesCount" style="color:var(--text-secondary); font-size:12px;"></span>
      </div>
      <div class="modal-body">
        <textarea id="gcodeViewer" readonly style="height:280px; width:100%; background:#18181c; color:#00ff66; font-family:monospace; font-size:11px; padding:8px; border:1px solid #333; resize:none;"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn-top" onclick="closePreview()">Close</button>
        <button class="btn-top" onclick="downloadGcode()" style="background:#007acc; color:#fff;">Save .gcode</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
